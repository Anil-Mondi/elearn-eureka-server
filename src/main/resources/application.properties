spring.application.name=${EUREKA_NAME:eureka-server}

eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=30000

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

eureka.instance.home-page-url=${EUREKA_HOME_URL:http://localhost:8761}
eureka.instance.status-page-url=${EUREKA_STATUS_URL:http://localhost:8761/actuator/info}
eureka.instance.health-check-url=${EUREKA_HEALTH_URL:http://localhost:8761/actuator/health}